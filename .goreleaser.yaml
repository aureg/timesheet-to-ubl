version: 2

project_name: ublcli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ublcli
    main: ./cmd/ublcli/main.go
    binary: ublcli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: archives
    ids:
      - ublcli
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github

release:
  github:
    owner: aureg
    name: timesheet-to-ubl